[package]
name = "forkdrift"
version = "0.1.0"
edition = "2024"
description = "Tells whether two recorded artifacts that state the same interface actually diverge, and reconciles the divergences over recorded branch states. Everything works from recorded files, and nothing is executed."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
